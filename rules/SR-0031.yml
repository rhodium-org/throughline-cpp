uid: SR-0031
type: system_requirement
status: approved
title: Do not use C++ exceptions
text: >-
  Do not use C++ exceptions, including related features such as std::exception_ptr; signal
  errors with status codes, assertions or an Init() method instead.
links:
- target: UR-0006
  type: implements
attrs:
  source_ref: "Google C++ Style Guide: Other C++ Features — Exceptions"
