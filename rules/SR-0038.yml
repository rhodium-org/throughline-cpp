uid: SR-0038
type: system_requirement
status: approved
title: Use sized integer types from <cstdint>
text: >-
  Use int for ordinary needs and a precisely sized type such as int64_t from <cstdint>
  when a specific width is required; avoid unsigned types except for bitfields and modular
  arithmetic.
