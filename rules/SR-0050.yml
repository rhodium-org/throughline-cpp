uid: SR-0050
type: system_requirement
status: approved
title: Name macros in ALL_CAPS with a project prefix
text: >-
  Name any macro in ALL_CAPS_WITH_UNDERSCORES with a project-specific prefix, and use
  macros only where genuinely unavoidable.
