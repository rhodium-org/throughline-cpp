uid: SR-0018
type: system_requirement
status: approved
title: Make inheritance public and prefer composition
text: >-
  Make all inheritance public, prefer composition to inheritance, restrict it to genuine
  is-a relationships, keep data members private, and mark every override with override or
  final.
links:
- target: UR-0003
  type: implements
attrs:
  source_ref: "Google C++ Style Guide: Classes — Inheritance"
