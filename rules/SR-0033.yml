uid: SR-0033
type: system_requirement
status: proposed
title: Avoid RTTI in production code
text: Avoid RTTI such as typeid and dynamic_cast in production code, preferring virtual
  methods or the visitor pattern; RTTI is permitted freely in tests.
normative: true
links:
