uid: SR-0033
type: system_requirement
status: approved
title: Avoid RTTI in production code
text: >-
  Avoid RTTI such as typeid and dynamic_cast in production code, preferring virtual
  methods or the visitor pattern; RTTI is permitted freely in tests.
links:
- target: UR-0006
  type: implements
attrs:
  source_ref: "Google C++ Style Guide: Other C++ Features — Run-Time Type Information"
