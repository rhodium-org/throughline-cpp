uid: SR-0030
type: system_requirement
status: approved
title: Restrict rvalue references to move and forwarding code
text: >-
  Use rvalue references only for move constructors and assignment, ref-qualified methods,
  forwarding references used with std::forward, and performance overload pairs; pass by
  value to consume a regular parameter.
