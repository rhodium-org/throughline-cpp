uid: SR-0024
type: system_requirement
status: approved
title: Overload only when the call is unambiguous to a reader
text: >-
  Use overloading only when a reader can tell which overload is called without knowing C++
  matching rules and the variants are semantically equivalent; put a single umbrella
  comment before the first declaration.
