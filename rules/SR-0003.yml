uid: SR-0003
type: system_requirement
status: approved
title: Include every header you directly use
text: >-
  Directly include a header for every symbol your file references and do not rely on
  transitive includes, even when your own .h already pulls the header in.
links:
- target: UR-0001
  type: implements
attrs:
  source_ref: "Google C++ Style Guide: Header Files — Include What You Use"
