uid: SR-0039
type: system_requirement
status: proposed
title: Avoid the preprocessor; prefer inline, const and constexpr
text: 'Avoid macros wherever possible, preferring inline functions, enums and const
  or constexpr variables; if a macro is unavoidable, give it a unique project prefix
  and #undef it promptly.'
normative: true
links:
