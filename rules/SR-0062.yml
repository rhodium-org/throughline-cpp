uid: SR-0062
type: system_requirement
status: approved
title: Attach * and & to the type in pointer and reference expressions
text: >-
  Place the * or & adjacent to the type rather than the variable name, writing Foo* foo,
  and be consistent when declaring several pointers.
links:
- target: UR-0009
  type: implements
attrs:
