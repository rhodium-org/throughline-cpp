uid: SR-0028
type: system_requirement
status: approved
title: Transfer ownership with std::unique_ptr
text: >-
  Make ownership transfer explicit with std::unique_ptr in the signature, and never use
  the deprecated std::auto_ptr.
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: "Google C++ Style Guide: Ownership — Smart Pointers"
