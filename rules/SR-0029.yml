uid: SR-0029
type: system_requirement
status: proposed
title: Use std::shared_ptr only when sharing is truly needed
text: Use std::shared_ptr only where shared ownership is genuinely necessary and
  avoid it otherwise, since shared ownership makes lifetimes hard to reason about.
normative: true
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: 'Google C++ Style Guide: Ownership — Shared Ownership'
