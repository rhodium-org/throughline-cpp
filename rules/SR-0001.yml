uid: SR-0001
type: system_requirement
status: approved
title: Make every header self-contained
text: >-
  Make every header file self-contained so it compiles on its own, ends in .h, and
  includes all headers its inline functions and templates need; use .inc files for
  non-self-contained content only sparingly.
links:
